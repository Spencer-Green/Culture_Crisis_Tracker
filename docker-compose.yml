services:
  postgres:
    image: postgres:16-alpine
    container_name: culture-crisis-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: culture_crisis_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - culture_crisis_tracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d culture_crisis_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  culture_crisis_tracker_postgres_data:
